<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Benjamín Macaya — GIF</title>
  <link rel="icon" type="image/icono.ico" href="images/favicon.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #050505;
      overflow: hidden;
      font-family: Candara, "Segoe UI", sans-serif;
    }

    .gif-page {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050505;
    }

    #mainGif {
      max-width: 100vw;
      max-height: 100vh;
      max-height: 100dvh;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    .back-button {
      position: absolute;
      top: 25px;
      left: 25px;
      color: white;
      text-decoration: none;
      font-size: 15px;
      z-index: 10;
    }
  </style>
</head>

<body>

  <main class="gif-page">

    <a href="index.html" class="back-button">← VOLVER</a>

    <img id="mainGif" alt="GIF LUZ">

  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const gifFile = params.get("src");

    if (gifFile === "images/VideosAnim (1).gif") {
      document.querySelector("#mainGif").src = gifFile;
    }
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Benjamín Macaya — Imagen</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .image-page {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #000;
    }

    #mainImage {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .back-button {
      position: absolute;
      top: 25px;
      left: 25px;

      color: white;
      text-decoration: none;
      font-size: 12px;

      z-index: 10;
      opacity: 0.8;
      transition: opacity 0.3s;
    }

    .back-button:hover {
      opacity: 1;
    }

    .fullscreen-button {
      position: absolute;
      top: 22px;
      right: 25px;

      color: white;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.5);
      padding: 9px 13px;

      font-size: 11px;
      cursor: pointer;
      z-index: 10;
    }

  </style>

</head>

<body>

  <main class="image-page">

    <a href="index.html" class="back-button">
      ← VOLVER
    </a>

    <button class="fullscreen-button" id="fullscreenButton">
      FULLSCREEN ↗
    </button>

    <img id="mainImage" alt="Imagen">

  </main>

  <script>

    const params = new URLSearchParams(window.location.search);
    const imageFile = params.get("src");

    const image = document.querySelector("#mainImage");
    const fullscreenButton = document.querySelector("#fullscreenButton");

    // Cargar imagen seleccionada
    if (imageFile) {
      image.src = imageFile;
    }

    // Pantalla completa
    fullscreenButton.addEventListener("click", () => {

      if (image.requestFullscreen) {
        image.requestFullscreen();
      }

    });

  </script>

</body>
</html>
